<header class="header">
  <div class="header__container">
    <div class="header__body">
      <div class="header__menu menu">
        <nav class="menu__body">
          <ul class="menu__list">
            <li class="menu__item">
              <a href="#" class="menu__link">Home</a>
            </li>
            <li class="menu__item">
              <a href="#" class="menu__link">About us</a>
            </li>
            <li class="menu__item">
              <a href="#" class="menu__link">Products</a>
            </li>
            <div data-da=".header__body, 1250" class="header__logo">
              <img src="@img/logo/logo.png" alt="logo" class="header__image" />
            </div>
            <li class="menu__item">
              <a href="#" class="menu__link">Flavors</a>
            </li>
            <li class="menu__item">
              <a href="#" class="menu__link">Contact Us</a>
            </li>
          </ul>

      <div class="header__actions">
        <div class="image-heart">
          <img src="@img/logo/Heart.svg" alt="image" />
        </div>
        <div class="image-shopping">
          <img
            src="@img/logo/shopping-cart .svg"
            alt="image"
            class="img-cart"
          />
        </div>
        <button type="button" class="menu__icon icon-menu">
          <span></span>

    </div>
